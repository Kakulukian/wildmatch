name: Publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Just build, don't publish"
        default: false
        required: false
        type: boolean
      npm_tag:
        description: "NPM tag"
        required: true
        default: "latest"

jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: arm64
            cross-target: x64
          - os: windows-latest
            target: x64
            cross-target: arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.21.0

      - name: Setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"

      - name: Install node_modules
        run: pnpm install --frozen-lockfile

      - name: Prebuild ${{ matrix.target }}
        run: pnpm prebuildify --napi --strip --arch ${{ matrix.target }}

      - name: Prebuild ${{ matrix.cross-target }}
        run: pnpm prebuildify --napi --strip --arch ${{ matrix.cross-target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/*

  prebuild_linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x64
          - os: ubuntu-24.04-arm
            target: arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.21.0

      - name: Setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"

      - name: Install node_modules
        run: pnpm install --frozen-lockfile

      - name: Prebuild ${{ matrix.target }}
        run: pnpm prebuildify --napi --strip --arch ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilds-linux-${{ matrix.target }}
          path: prebuilds/*

  publish:
    name: Publish

    permissions:
      id-token: "write"
      contents: "write"
      packages: "write"

    runs-on: ubuntu-latest
    needs: [prebuild, prebuild_linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.21.0

      - name: Setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org/"

      - name: Download prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true

      - name: Install node_modules
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          PREBUILDS_ONLY: 1

      - name: Publish
        run: pnpm publish --tag '${{ github.event.inputs.npm_tag }}' --access public --provenance --no-git-checks ${{ inputs.dry_run && '--dry-run' || ''}}
